<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html { color-scheme: light; background: #f8fafc; }
      html.dark { color-scheme: dark; background: #020617; }
    </style>
    <script>
      try {
        const stored = localStorage.getItem('theme-scheme');
        const scheme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        document.documentElement.classList.toggle('dark', scheme === 'dark' || (scheme === 'system' && prefersDark));
      } catch {}
    </script>
    <title>Registro de pasajeros</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
